name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only ever needs to read the repository. Nothing here writes a
# comment, a release or a package, so the default token gets no scopes at all.
permissions:
  contents: read

# A new push to a PR makes the previous run's answer irrelevant; cancelling it
# is the difference between a 4-minute green check and a queue of stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder-domain guard (src/config/site.ts) fails production builds
  # on example.com URLs. CI is not a production deploy, so use
  # non-example dummy values to let typecheck/lint/build run.
  NEXT_PUBLIC_SITE_URL: https://ci.local
  NEXT_PUBLIC_CONTACT_EMAIL: ci@ci.local

jobs:
  quality:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Reported, not enforced. `printWidth` was corrected from 100 to 120 to
      # match how the code is written, and files still hold lines over 120.
      # Making this blocking is a one-line change to `verify` once someone
      # commits a reviewed `npm run format` pass; until then a hard gate would
      # just train everyone to ignore red.
      - name: format:check (advisory)
        run: npm run format:check
        continue-on-error: true

  build:
    name: build + bundle budget + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # The pdf.js worker is 1,232,303 bytes and is fetched the moment anyone
      # uploads a PDF. Nothing else in this repo is as large and nothing was
      # watching it, so a bundling change that quietly doubled it would have
      # shown up as a slower first analysis and nothing else. The ceiling is
      # ~27% above today's size: loose enough to absorb a patch release,
      # tight enough to catch a regression that starts shipping the whole
      # pdfjs-dist package.
      - name: bundle budget
        run: |
          set -euo pipefail
          budget=$((1536 * 1024))
          worker=$(find .next/static -name 'pdf.worker.min.*.mjs' -print -quit)
          if [ -z "$worker" ]; then
            echo "::error::pdf.js worker not found in .next/static - the PDF path stopped being bundled or moved."
            exit 1
          fi
          size=$(stat -c%s "$worker")
          total=$(du -sb .next/static | cut -f1)
          printf 'pdf.js worker: %s bytes (budget %s)\n' "$size" "$budget"
          printf '.next/static total: %s bytes\n' "$total"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::pdf.js worker is $size bytes, over the ${budget}-byte budget."
            exit 1
          fi

      # The cheapest substitute for the E2E suite this project does not have:
      # start the real production server and assert that the routes answer, the
      # security headers actually ship, and the claims in README's deployment
      # section are true of the artifact rather than of the source.
      - name: runtime smoke test
        run: |
          set -euo pipefail
          npm run start &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then break; fi
            sleep 1
          done

          for route in / /check /how-scoring-works /privacy /terms /contact; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$route")
            [ "$code" = "200" ] || { echo "::error::$route returned $code"; exit 1; }
          done

          headers=$(curl -sSI http://localhost:3000/)
          for header in content-security-policy strict-transport-security x-content-type-options cross-origin-opener-policy cross-origin-resource-policy referrer-policy; do
            echo "$headers" | grep -qi "^$header:" || { echo "::error::missing $header"; exit 1; }
          done
          if echo "$headers" | grep -qi '^x-powered-by:'; then
            echo "::error::X-Powered-By is exposed"
            exit 1
          fi
          if echo "$headers" | grep -qi 'script-src[^;]*unsafe-eval'; then
            echo "::error::production CSP allows unsafe-eval"
            exit 1
          fi
          if echo "$headers" | grep -qi "script-src[^;]*unsafe-inline"; then
            echo "::error::production CSP allows unsafe-inline"
            exit 1
          fi

          curl -fsS http://localhost:3000/robots.txt | grep -q 'Disallow: /check'
          test "$(curl -fsS http://localhost:3000/sitemap.xml | grep -o '<url>' | wc -l)" -eq 6

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `pdfjs-dist@^5` parses untrusted binary input in the browser, which
      # makes the dependency tree security-relevant rather than merely
      # inconvenient, and every direct dependency is on a caret range.
      #
      # Advisory, not blocking, on purpose: a transitive advisory published
      # overnight must not be able to block an unrelated PR, and this repo
      # cannot patch a transitive fix without a lockfile bump anyway. Run it,
      # read it, and bump deliberately. Dependabot has this covered weekly.
      - run: npm audit --audit-level=high
        continue-on-error: true